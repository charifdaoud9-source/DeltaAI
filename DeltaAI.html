<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELTA AI | متصل بمحرك Google</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --neon: #00f3ff; --google-blue: #4285F4; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; }
        
        .sidebar { width: 260px; background: #000; border-left: 1px solid var(--neon); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .main { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at center, #0a0a0a, #050505); }
        
        header { padding: 15px 30px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: center; }
        .status-online { color: #00ff00; font-size: 12px; display: flex; align-items: center; gap: 5px; }

        #chatBox { flex: 1; padding: 20px 12%; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; }

        /* صندوق التفكير والبحث */
        .thought-container {
            background: rgba(66, 133, 244, 0.05);
            border: 1px solid rgba(66, 133, 244, 0.2);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }
        .search-step { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #aaa; margin-bottom: 8px; }
        .loader-line { height: 2px; background: var(--google-blue); width: 0%; animation: load 2s forwards; }

        .final-answer { background: rgba(255,255,255,0.02); padding: 20px; border-radius: 15px; border-right: 4px solid var(--neon); line-height: 1.8; position: relative; }
        .sources-list { margin-top: 15px; padding-top: 10px; border-top: 1px solid #222; font-size: 11px; color: var(--google-blue); }

        .input-wrapper { padding: 25px 12%; background: #080808; display: flex; gap: 15px; border-top: 1px solid #111; }
        input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 12px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--google-blue); box-shadow: 0 0 15px rgba(66, 133, 244, 0.2); }
        .btn-send { background: var(--google-blue); color: #fff; border: none; padding: 0 25px; border-radius: 12px; cursor: pointer; font-weight: bold; }

        @keyframes load { to { width: 100%; } }
        @keyframes slideIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color:var(--neon); text-align:center">DELTA AI</h2>
    <div style="margin-top:20px; padding:10px; background:rgba(66,133,244,0.1); border-radius:8px; font-size:12px; color:var(--google-blue);">
        <span class="material-icons" style="font-size:14px; vertical-align:middle">public</span> بروتوكول Google Search مفعل
    </div>
</div>

<div class="main">
    <header>
        <div style="font-weight:bold; letter-spacing:1px">مركز العمليات الشبكي</div>
        <div class="status-online"><span class="material-icons" style="font-size:12px">cloud_done</span> متصل بخوادم Google</div>
    </header>

    <div id="chatBox">
        <div class="final-answer">نظام DELTA متصل الآن بمحركات البحث العالمية. اسألني عن أي خبر حديث، سعر عملة، أو معلومة تاريخية وسأقوم بالبحث عنها فوراً.</div>
    </div>

    <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="ابحث في Google عبر DELTA..." onkeypress="if(event.key==='Enter') startSearch()">
        <button class="btn-send" onclick="startSearch()">بحث ذكي</button>
    </div>
</div>

<script>
    function startSearch() {
        const query = document.getElementById('userInput').value.trim();
        if(!query) return;

        // إضافة رسالة المستخدم
        addMsg(query, 'user');
        document.getElementById('userInput').value = '';

        // إنشاء واجهة البحث (التفكير)
        const responseId = 'res_' + Date.now();
        const deltaArea = document.createElement('div');
        deltaArea.className = 'message-area';
        deltaArea.innerHTML = `
            <div class="thought-container">
                <div class="search-step"><span class="material-icons" style="font-size:16px; color:var(--google-blue)">search</span> جاري إرسال الاستعلام إلى محرك Google...</div>
                <div class="search-step"><span class="material-icons" style="font-size:16px; color:#ea4335">language</span> فحص المصادر والمواقع الموثوقة...</div>
                <div class="search-step"><span class="material-icons" style="font-size:16px; color:#fbbc05">description</span> تلخيص البيانات وتحليل النتائج...</div>
                <div class="loader-line"></div>
            </div>
            <div class="final-answer" id="${responseId}" style="display:none"></div>
        `;
        document.getElementById('chatBox').appendChild(deltaArea);
        scroll();

        // محاكاة استرجاع النتائج من جوجل
        setTimeout(() => {
            const result = generateWebResult(query);
            const answerDiv = document.getElementById(responseId);
            answerDiv.innerHTML = result.text;
            answerDiv.innerHTML += `
                <div class="sources-list">
                    <b>🔗 المصادر المستخرجة من البحث:</b><br>
                    1. Google Search Index (2026)<br>
                    2. ${result.sourceSite}<br>
                    3. أرشيف المعلومات العالمي
                </div>
            `;
            answerDiv.style.display = 'block';
            scroll();
        }, 3500);
    }

    function generateWebResult(q) {
        // محاكاة ذكية للنتائج بناءً على الكلمات
        if(q.includes("سعر") || q.includes("تداول")) {
            return { text: `بناءً على تحديثات Google المالية للحظة الحالية، تظهر الأرقام أن السوق في حالة تذبذب إيجابي. الأسعار المسجلة في المنصات العالمية تشير إلى ثبات في مستويات الدعم الرئيسية.`, sourceSite: "Binance & Bloomberg Live" };
        }
        if(q.includes("من انت") || q.includes("مؤسس")) {
            return { text: `أنا DELTA، نظام ذكاء اصطناعي مستقل متصل بشبكة الإنترنت. تم تطويري بواسطة (أنت) في عام 2026 لأكون جسراً بين المستخدم والبيانات العالمية.`, sourceSite: "DELTA Official Database" };
        }
        return { text: `بعد فحص نتائج البحث في Google حول "${q}"، وجدت أن هذا الموضوع يحظى باهتمام كبير حالياً. تشير التقارير إلى أن التطورات الأخيرة في هذا المجال تركز على الكفاءة والابتكار الرقمي.`, sourceSite: "Wikipedia & News Portals" };
    }

    function addMsg(text, type) {
        const div = document.createElement('div');
        div.style.alignSelf = type === 'user' ? 'flex-start' : 'flex-end';
        div.className = 'final-answer';
        div.style.background = type === 'user' ? '#1a1a1a' : 'rgba(0, 243, 255, 0.03)';
        div.style.borderRight = type === 'user' ? '3px solid #bc13fe' : '3px solid var(--neon)';
        div.innerText = text;
        document.getElementById('chatBox').appendChild(div);
        scroll();
    }

    function scroll() {
        const box = document.getElementById('chatBox');
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
