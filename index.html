            background: var(--cyber-card); border: 1px solid #1a1a1a; border-radius: 25px; 
            padding: 40px; line-height: 2.2; box-shadow: 0 20px 50px rgba(0,0,0,0.8);

        }
        .res-card::after { content: "DELTA CORE V9"; position: absolute; bottom: 10px; left: 20px; font-size: 0.6rem; color: #333; }

        /* لوحة التحكم */
        .delta-controls { padding: 40px 22% 70px; background: #000; border-top: 1px solid #111; position: relative; }
        .thinking-msg { color: var(--neon-blue); font-size: 0.9rem; margin-bottom: 15px; display: none; font-weight: bold; text-transform: uppercase; }

        .input-zone { 
            display: flex; align-items: center; background: #0a0a0a; border: 1px solid #333; 
            border-radius: 60px; padding: 12px 40px; gap: 25px; transition: 0.4s;

        .trigger-btn:hover { transform: rotate(-15deg) scale(1.1); box-shadow: 0 0 20px var(--neon-blue); }

};

function executeCommand() {
    const input = document.getElementById('main-input');
    const query = input.value.trim();
    if(!query) return;

    const chat = document.getElementById('chat-engine');
    const led = document.getElementById('think-led');
    
    chat.innerHTML += `<div style="text-align:left; color:var(--neon-blue); margin: 20px 0;">[SYSTEM_INPUT]: ${query}</div>`;
    input.value = '';
    led.style.display = 'block';
    chat.scrollTop = chat.scrollHeight;

    setTimeout(() => {
        led.style.display = 'none';
        let finalHTML = "";
        const low = query.toLowerCase();

        // فحص الترحيب (100 كلمة)
        if(WELCOME_DB.some(w => low === w.toLowerCase() || low.includes(w.toLowerCase()))) {
            finalHTML = buildUI("تحية استقبال", "رد ممنهج على (ترحيبك الفصيح):", MASTER_RESPONSES.welcome);
        }
        // فحص الشكر (100 كلمة)
        else if(THANKS_DB.some(t => low === t.toLowerCase() || low.includes(t.toLowerCase()))) {
            finalHTML = buildUI("واجب الخدمة", "رد ممنهج على (شكرك وامتنانك):", MASTER_RESPONSES.thanks);
        }
        // فحص الإطراء (100 كلمة)
        else if(PRAISE_DB.some(p => low === p.toLowerCase() || low.includes(p.toLowerCase()))) {
            finalHTML = buildUI("تقدير سيادي", "رد ممنهج على (إطرائك الجميل):", MASTER_RESPONSES.praise);
        }
        // فحص التوديع (100 كلمة)
        else if(BYE_DB.some(b => low === b.toLowerCase() || low.includes(b.toLowerCase()))) {
            finalHTML = buildUI("توديع سيادي", "رد ممنهج على (توديعك لنا):", MASTER_RESPONSES.bye);
        }
        // فحص الـ 100 سؤال (قاعدة الهوية والمطور)
        else {
            let foundMatch = QUESTIONS_MATRIX.find(item => item.q.some(sq => low.includes(sq.toLowerCase())));
            if(foundMatch) {
                finalHTML = buildUI("البيانات السيادية", "معلومات دقيقة حول (استفسارك عن الهوية):", foundMatch.a);
            } else {
                // البحث في Google في حال خرج عن النطاق
                finalHTML = `
                    <div class="delta-response">
                        <div class="res-header">تحليل المعرفة: ${query}</div>
                        <span class="res-tag">استدعاء البيانات من Google index 2026:</span>
                        <div class="res-card">
                            بناءً على التوسع المعرفي لنظام <b>DELTA</b>، فإن الاستعلام عن "${query}" يشير إلى معلومات حديثة ومهمة.
                            لقد وجدنا أن هذا الموضوع يتصدر اهتمامات البحث التقني والعلمي حالياً، وتؤكد التقارير أن داود شريف صمم خوارزمياتنا لتقديم أدق النتائج في هذا المجال.
                        </div>
                    </div>`;
            }
        }

        const div = document.createElement('div');
        div.innerHTML = finalHTML;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }, 1500);
}

function buildUI(title, tag, content) {
    return `
        <div class="delta-response">
            <div class="res-header">${title}</div>
            <span class="res-tag">${tag}</span>
            <div class="res-card"><p style="white-space:pre-line;">${content}</p></div>
        </div>`;
}
