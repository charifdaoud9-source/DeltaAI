<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELTA AI | نظام المطور شريف داود</title>
    <style>
        :root { --bg: #ffffff; --text: #1a1a1b; --accent: #4285F4; --thought-bg: #f8f9fa; }
        [data-theme="dark"] { --bg: #0d0d0d; --text: #ececec; --thought-bg: #1a1a1a; }
        
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; transition: 0.3s; }
        header { padding: 10px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px 15%; display: flex; flex-direction: column; gap: 30px; }
        
        /* التفكير - ستايل الصورة 1 */
        .thought-container { border-right: 2px solid #ddd; padding-right: 15px; margin: 10px 0; color: #70757a; font-size: 0.95rem; }
        .thought-header { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--accent); font-weight: 500; }
        .thought-body { margin-top: 8px; line-height: 1.5; white-space: pre-line; }

        /* الإجابة - ستايل الصورة 2 */
        .answer-wrapper { line-height: 1.8; animation: fadeIn 0.5s ease; }
        .intro-text { font-size: 1.1rem; margin-bottom: 15px; }
        .section-title { font-size: 1.4rem; font-weight: bold; margin: 25px 0 15px; color: var(--text); }
        .info-card { background: var(--thought-bg); border-radius: 12px; padding: 20px; margin-top: 15px; }
        
        .sources { margin-top: 30px; padding-top: 15px; border-top: 1px solid #eee; font-size: 0.85rem; color: var(--accent); }
        .source-tag { background: #e8f0fe; padding: 2px 8px; border-radius: 4px; margin-left: 5px; cursor: pointer; }

        .input-area { padding: 20px 15% 40px; }
        .input-box { background: var(--thought-bg); border: 1px solid #ddd; border-radius: 24px; display: flex; padding: 8px 20px; }
        input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; font-size: 1rem; }
        button { background: var(--accent); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .dots::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0% { content: ''; } 33% { content: '.'; } 66% { content: '..'; } 100% { content: '...'; } }
    </style>
</head>
<body data-theme="dark">

<header>
    <div style="font-weight: bold;">DELTA <span style="color:var(--accent)">PRO</span></div>
    <div style="font-size: 0.8rem; opacity: 0.6;">المطور: شريف داود</div>
</header>

<div id="chat-container"></div>

<div class="input-area">
    <div class="input-box">
        <input type="text" id="userInput" placeholder="اسأل DELTA..." onkeypress="if(event.key==='Enter') handleRequest()">
        <button onclick="handleRequest()">↑</button>
    </div>
</div>

<script>
    // قاعدة البيانات السيادية (الـ 100 سؤال عن شريف و DELTA)
    const sovereignDB = [
        {
            keys: ["من انت", "عرف نفسك", "مين انت"],
            answer: "أنا DELTA، مساعد ذكاء اصطناعي فائق، تم تطويري وبرمجتي بالكامل من قبل المطور **شريف داود**. أنا لست مجرد برنامج، بل أنا نتاج رؤية تقنية تهدف لتقديم أدق المعلومات والتحليلات."
        },
        {
            keys: ["من هو شريف داود", "من مؤسسك", "مين اللي صنعك", "صاحب البرنامج"],
            answer: "مؤسسي هو **شريف داود**، مطور برامج جزائري مبدع يبلغ من العمر 16 عاماً. هو طالب في السنة الأولى ثانوي (تخصص علوم وتكنولوجيا). عُرف بشغفه في تطوير الأنظمة الذكية، تداول العملات الرقمية، وخبرته في إدارة أنظمة Windows وألعاب المحاكاة."
        },
        {
            keys: ["متى تاسست", "تاريخ ميلادك", "متى بدات"],
            answer: "تم وضع حجر الأساس لنظام DELTA في مارس 2026 على يد شريف داود، ومنذ ذلك الحين وأنا في تطوير مستمر لأصل إلى أعلى مستويات الذكاء."
        }
        // يمكن إضافة بقية الـ 100 سؤال بنفس الطريقة هنا
    ];

    function handleRequest() {
        const query = document.getElementById('userInput').value.trim();
        if(!query) return;

        const chat = document.getElementById('chat-container');
        chat.innerHTML += `<div style="text-align:left; font-weight:bold; margin-bottom:10px;">${query}</div>`;
        document.getElementById('userInput').value = '';

        const msgDiv = document.createElement('div');
        chat.appendChild(msgDiv);

        // 1. مرحلة التفكير (Thought)
        msgDiv.innerHTML = `
            <div class="thought-container">
                <div class="thought-header">Thought for 2 seconds <span class="dots"></span></div>
                <div class="thought-body">جاري تحليل الطلب وفق بروتوكولات المطور شريف داود...
                ${query.length > 5 ? 'التحقق من قاعدة البيانات الداخلية والمصادر العالمية...' : ''}</div>
            </div>`;
        
        scroll();

        setTimeout(() => {
            const internalMatch = sovereignDB.find(item => item.keys.some(k => query.includes(k)));
            
            if (internalMatch) {
                // إجابة من قاعدة البيانات الداخلية (بدون جوجل)
                renderFinalAnswer(msgDiv, internalMatch.answer, false, query);
            } else {
                // إجابة خارجية (منهجية جوجل)
                renderFinalAnswer(msgDiv, "", true, query);
            }
        }, 2000);
    }

    function renderFinalAnswer(container, text, isExternal, query) {
        let finalHTML = "";
        if (!isExternal) {
            finalHTML = `<div class="answer-wrapper">${text}</div>`;
        } else {
            // منهجية الصورة 2 (معلومات غزيرة من جوجل)
            finalHTML = `
                <div class="answer-wrapper">
                    <div class="intro-text">أكيد! ${query} هو موضوع ذو أهمية كبيرة، وسأقوم بتزويدك بكافة التفاصيل المتوفرة حوله.</div>
                    <div style="margin-bottom:20px">👇 سأعطيك دليلاً مرتباً ومفيداً حول <b>${query}</b></div>
                    
                    <div class="section-title">1) نظرة عامة وتحليل شامل</div>
                    <div class="info-card">
                        بناءً على البيانات المتاحة، يعتبر ${query} من المجالات التي تشهد تطوراً مستمراً. تشير المعلومات إلى أن هذا الموضوع يرتكز على عدة ركائز أساسية...
                        <ul>
                            <li>المعطى الأول: تحديثات عام 2026 تشير إلى استقرار في النتائج.</li>
                            <li>المعطى الثاني: المصادر العالمية تؤكد على جودة البيانات المتعلقة به.</li>
                        </ul>
                    </div>

                    <div class="section-title">2) لماذا يهمنا هذا الموضوع؟</div>
                    <p>إذا كنت مهتماً بالبحث العميق، فإن ${query} يوفر حلولاً مبتكرة وتسهيلات تقنية لم تكن موجودة سابقاً.</p>

                    <div class="sources">
                        📌 المصادر: <span class="source-tag">Google Search 2026</span> <span class="source-tag">DELTA Wiki</span> <span class="source-tag">Archives</span>
                    </div>
                </div>`;
        }
        container.innerHTML += finalHTML;
        scroll();
    }

    function scroll() {
        const chat = document.getElementById('chat-container');
        chat.scrollTop = chat.scrollHeight;
    }
</script>

</body>
</html>
