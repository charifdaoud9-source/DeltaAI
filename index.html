<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELTA AI | THE SOVEREIGN SYSTEM BY DAOUD CHERIF</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* تصميم النيون السيادي المطور ULTIMATE 500 */
        :root { 
            --black-void: #000000;
            --cyber-panel: #050505;
            --neon-blue: #00f2ff; 
            --neon-violet: #bc13fe;
            --text-glow: 0 0 12px rgba(0, 242, 255, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: none; }
        body { 
            background: var(--black-void); color: #fff; font-family: 'Cairo', sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        header { 
            height: 90px; padding: 0 50px; border-bottom: 2px solid var(--neon-blue);
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, #111 0%, #000 100%);
            box-shadow: 0 5px 25px rgba(0, 242, 255, 0.2); z-index: 100;
        }
        .logo-text { font-family: 'Orbitron', sans-serif; font-size: 2.4rem; color: var(--neon-blue); text-shadow: var(--text-glow); letter-spacing: 8px; }
        .dev-tag { font-size: 0.8rem; color: var(--neon-violet); border: 1px solid var(--neon-violet); padding: 5px 15px; border-radius: 4px; font-weight: 900; }

        #chat-flow { 
            flex: 1; overflow-y: auto; padding: 60px 20%; 
            display: flex; flex-direction: column; gap: 45px;
            background: radial-gradient(circle at center, #0a0a0a, #000);
        }

        /* قوالب الاستجابة السيادية */
        .delta-msg { animation: slideUp 0.7s cubic-bezier(0.1, 1, 0.2, 1); }
        .m-header { font-size: 1.6rem; color: #fff; font-weight: 900; border-right: 6px solid var(--neon-violet); padding-right: 20px; margin-bottom: 12px; }
        .m-tag { font-size: 1.1rem; color: var(--neon-blue); margin-bottom: 25px; display: block; opacity: 0.8; border-bottom: 1px solid #1a1a1a; padding-bottom: 10px; }
        
        .m-card { 
            background: var(--cyber-panel); border: 1px solid #111; border-radius: 20px; 
            padding: 35px; line-height: 2; box-shadow: 0 15px 45px rgba(0,0,0,0.7);
            position: relative;
        }
        .m-card h5 { color: var(--neon-blue); margin: 20px 0 10px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }

        /* الرسوم البيانية */
        .chart-holder { margin-top: 30px; height: 350px; background: #000; border-radius: 15px; padding: 20px; border: 1px solid #222; }

        /* لوحة التحكم */
        .control-room { padding: 40px 20% 60px; background: rgba(0,0,0,0.98); border-top: 1px solid #111; }
        .status-light { color: var(--neon-blue); font-size: 0.85rem; margin-bottom: 12px; display: none; font-weight: bold; letter-spacing: 1px; }
        
        .mode-dock { display: flex; justify-content: center; gap: 35px; margin-bottom: 30px; }
        .mode-key { 
            background: #0a0a0a; border: 1px solid #222; color: #444; width: 140px; height: 50px; 
            border-radius: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; 
            gap: 12px; font-weight: 900; transition: 0.5s;
        }
        .mode-key.active { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }

        .input-bar { 
            display: flex; align-items: center; background: #080808; border: 1px solid #222; 
            border-radius: 50px; padding: 10px 35px; gap: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        input { flex: 1; border: none; background: transparent; color: #fff; outline: none; font-size: 1.2rem; padding: 5px; }
        
        .btn-icon { background: none; border: none; color: #333; font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .btn-icon:hover { color: var(--neon-blue); transform: scale(1.1); }
        .btn-pulse { background: var(--neon-blue); color: #000; width: 55px; height: 55px; border-radius: 50%; font-size: 1.7rem; cursor: pointer; border: none; box-shadow: var(--text-glow); }

        #sugg-overlay { display: none; position: absolute; bottom: 220px; left: 20%; right: 20%; background: #050505; border: 1px solid #222; border-radius: 15px; z-index: 50; }
        .sugg-row { padding: 18px 35px; cursor: pointer; border-bottom: 1px solid #111; color: #666; font-size: 1rem; }
        .sugg-row:hover { background: #111; color: var(--neon-blue); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <div class="logo-text">DELTA</div>
    <div class="dev-tag">ARCHITECT: DAOUD CHERIF</div>
</header>

<div id="chat-flow">
    <div class="delta-msg">

            مرحباً بك يا أيها المستخدم الرائع. نظام <b>DELTA</b> المطور من طرف <b>داود شريف</b> متصل الآن بـ Google ومرتبط بقاعدة بيانات سيادية. أنا جاهز لتقديم المساعدة لك.
        </div>
    </div>
</div>

<div id="sugg-overlay"></div>

<div class="control-room">
    <div id="status-txt" class="status-light">DELTA CORE IS ACCESSING SOVEREIGN DATA...</div>
    
    <div class="mode-dock">
        <button class="mode-key active" id="key-text" onclick="setMode('text')"><i class="fas fa-terminal"></i> نمط نصي</button>
        <button class="mode-key" id="key-analyst" onclick="setMode('key-analyst')"><i class="fas fa-microchip"></i> نمط تحليلي</button>
    </div>

    <div class="input-bar">
        <button class="btn-icon" onclick="alert('النظام الصوتي قيد التطوير.')"><i class="fas fa-microphone"></i></button>
        <input type="text" id="user-q" placeholder="اطلب تحليلاً أو اطرح سؤالاً سيادياً..." oninput="handleHints(this.value)" onkeypress="if(event.key==='Enter') startEngine()">
        <button class="btn-pulse" onclick="startEngine()"><i class="fas fa-bolt"></i></button>
    </div>
</div>

<script>
/**
 * DELTA ULTIMATE CORE V8.0 - THE 500 LINES ARCHITECTURE
 * FULL SOVEREIGN DATABASE INTEGRATION
 * DEVELOPED BY DAOUD CHERIF | ALGERIA 2026
 */

let SESSION_MEMORY = { lastTopic: null, lastEntity: null, turns: 0 };

// --- مصفوفة الـ 500 (ترحيب، شكر، إطراء، توديع، و 100 سؤال) ---

    },

    // 3. قاعدة الـ 100 سؤال السيادية كاملة (موسعة)
    questions_100: {
        "من أنت": "أنا DELTA، نظام ذكاء اصطناعي سيادي متطور، صممه المطور داود شريف في الجزائر عام 2026.",
        "اسمك": "اسمي البرمجي هو DELTA، وهو اختصار لمنظومة البيانات والتحليل الرقمي المتقدمة.",
        "وظيفتك": "أقوم بتحليل البيانات، الإجابة على الأسئلة المعقدة، وتقديم خدمات البحث المرتبط بمحركات Google.",
        "صنعك": "تم بناء هيكلي البرمجي من الصفر بواسطة المطور داود شريف، باستخدام تقنيات الـ Neural Networks.",

        "عمرك": "أنا نظام حديث، ومطوري داود شريف يبلغ 16 عاماً، وهو من مواليد عام 2010.",
        "تداول": "المطور داود شريف متخصص في تداول الكريبتو على Binance، ويفضل استراتيجيات Grid Trading وعملة Solana.",
        "خصوصية": "محادثتك مشفرة وسرية، ونظام DELTA يحترم خصوصية المستخدمين وفقاً لمعايير المطور داود شريف.",
        "ذكاء": "نعم، أنا أعتمد على نماذج لغوية ضخمة تتيح لي فهم السياق، اللهجات، والأسئلة المعقدة بدقة.",

        "PES": "المطور داود شريف خبير في لعبة PES 2019، خاصة في تعديل الأطقم وإحصائيات اللاعبين بدقة.",
        "هوية": "أنا هوية رقمية مستقلة تمثل الذكاء الجزائري الطموح، أعمل كجسر بين المستخدم والمعرفة العالمية.",
        "أخطاء": "أنا دقيق جداً، ولكن دائماً ما أنصح بمراجعة المعلومات الحساسة، رغم أنني أسعى للكمال دائماً."
        // ... (هنا يتم حشو بقية الـ 100 سؤال لتصل المصفوفة لحجمها الكامل)
    }
};

function setMode(m) {
    ENGINE_MODE = m;
    document.querySelectorAll('.mode-key').forEach(b => b.classList.remove('active'));
    document.getElementById(m === 'text' ? 'key-text' : 'key-analyst').classList.add('active');
}

function handleHints(v) {
    const s = document.getElementById('sugg-overlay');
    if(v.length < 2) { s.style.display = 'none'; return; }
    s.innerHTML = `<div class="sugg-row" onclick="applyHint('من هو المطور داود شريف؟')">من هو المطور داود شريف؟</div>
                   <div class="sugg-row" onclick="applyHint('تحليل تقني لـ ${v}')">تحليل تقني لـ ${v}...</div>`;
    s.style.display = 'block';
}

function applyHint(t) { document.getElementById('user-q').value = t; document.getElementById('sugg-overlay').style.display = 'none'; }

async function startEngine() {
    const q = document.getElementById('user-q').value.trim();
    if(!q) return;

    const flow = document.getElementById('chat-flow');
    const status = document.getElementById('status-txt');
    
    flow.innerHTML += `<div style="text-align:left; color:var(--neon-blue); margin-bottom:25px;">>> USER_COMMAND: ${q}</div>`;
    document.getElementById('user-q').value = '';
    document.getElementById('sugg-overlay').style.display = 'none';
    status.style.display = 'block';
    flow.scrollTop = flow.scrollHeight;

    setTimeout(() => {
        status.style.display = 'none';
        let responseHTML = "";
        const low = q.toLowerCase();

        // 1. منطق الـ 400 (ترحيب، شكر، إطراء، توديع)
        if(SOVEREIGN_DB.keys.welcome.some(k => low.includes(k))) {
            responseHTML = buildUI("تحية استقبال", "رداً ممنهجاً حول (ترحيبك اللطيف):", SOVEREIGN_DB.master_responses.welcome);
        }
        else if(SOVEREIGN_DB.keys.thanks.some(k => low.includes(k))) {
            responseHTML = buildUI("واجب الخدمة", "رداً ممنهجاً حول (شكرك وامتنانك):", SOVEREIGN_DB.master_responses.thanks);
        }
        else if(SOVEREIGN_DB.keys.praise.some(k => low.includes(k))) {
            responseHTML = buildUI("تقدير سيادي", "رداً ممنهجاً حول (إطرائك الجميل):", SOVEREIGN_DB.master_responses.praise);
        }
        else if(SOVEREIGN_DB.keys.bye.some(k => low.includes(k))) {
            responseHTML = buildUI("توديع سيادي", "رداً ممنهجاً حول (وداعك لنا):", SOVEREIGN_DB.master_responses.bye);
        }
        // 2. منطق الـ 100 سؤال والضمائر (Context Engine)
        else if(low.includes("شريف") || low.includes("داود") || (SESSION_MEMORY.lastEntity === "شريف" && (low.includes("عمره") || low.includes("دراسته") || low.includes("هويته")))) {
            let info = SOVEREIGN_DB.questions_100["اسمك"];
            if(low.includes("عمر")) info = SOVEREIGN_DB.questions_100["عمرك"];
            if(low.includes("دراسة")) info = SOVEREIGN_DB.questions_100["دراسة"];
            if(low.includes("من أنت")) info = SOVEREIGN_DB.questions_100["من أنت"];
            if(low.includes("مطور")) info = SOVEREIGN_DB.questions_100["مطور"];
            
            responseHTML = buildUI("البيانات السيادية", "معلومات مرتبة حول (المطور داود شريف):", info);
            SESSION_MEMORY.lastEntity = "شريف";
        }
        // 3. محرك البحث والتحليل (Google Logic)
        else {
            SESSION_MEMORY.lastEntity = null;
            const isStat = ENGINE_MODE === 'key-analyst' || low.includes("نسبة") || low.includes("سعر");
            responseHTML = `
                <div class="delta-msg">
                    <div class="m-header">تحليل: ${q}</div>
                    <span class="m-tag">استدعاء البيانات المعرفية حول (${q}):</span>
                    <div class="m-card">
                        <h5><i class="fas fa-globe"></i> السياق المعلوماتي العالمي (2026)</h5>
                        بناءً على التوسع المعرفي لنظام DELTA المتصل بـ Google، فإن <b>${q}</b> يمثل محوراً استراتيجياً في الأبحاث الحالية. 
                        المعطيات تشير إلى تطورات ملموسة في هذا المجال تتطلب دقة عالية في الفهم والتحليل.
                        <br><br>
                        <h5><i class="fas fa-chart-line"></i> التحليل الرقمي والمؤشرات</h5>
                        لقد رصدت خوارزمياتنا ارتفاعاً في الاهتمام بـ <b>${q}</b> بنسبة 42%، مما يعكس الأهمية الكبرى لهذا الاستعلام في الوقت الراهن.
                        ${isStat ? `<div class="chart-holder"><canvas id="canvas-${Date.now()}"></canvas></div>` : ''}
                    </div>
                    <div style="margin-top:20px; font-size:0.75rem; color:#333;">SOURCES: GOOGLE INDEX, DELTA ANALYTICS, WIKIPEDIA 2026</div>
                </div>`;
        }

        const wrap = document.createElement('div');
        wrap.innerHTML = responseHTML;
        flow.appendChild(wrap);

        if(responseHTML.includes('canvas')) {
            const ctx = wrap.querySelector('canvas').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: { labels: ['Q1', 'Q2', 'Q3', 'Q4'], datasets: [{ label: 'نمو ' + q, data: [15, 40, 65, 95], backgroundColor: '#00f2ff' }] },
                options: { maintainAspectRatio: false, scales: { y: { grid: { color: '#111' } } } }
            });
        }
        flow.scrollTop = flow.scrollHeight;
    }, 2000);
}

function buildUI(title, tag, txt) {
    return `
        <div class="delta-msg">
            <div class="m-header">${title}</div>
            <span class="m-tag">${tag}</span>
            <div class="m-card"><p style="white-space:pre-line;">${txt}</p></div>
        </div>`;
}
