<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELTA AI | The Ultimate Sovereign</title>
    <style>
        :root { --bg: #050505; --text: #f0f0f0; --accent: #4285F4; --card: #121212; --border: #2a2a2a; --gold: #D4AF37; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 12px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 100; }
        .logo-text { font-weight: 900; font-size: 1.4rem; letter-spacing: 3px; color: var(--accent); text-shadow: 0 0 10px rgba(66, 133, 244, 0.3); }
        
        #chat-flow { flex: 1; overflow-y: auto; padding: 30px 15%; display: flex; flex-direction: column; gap: 40px; scroll-behavior: smooth; }

        /* مؤشر الكتابة الحية */
        .typing { font-size: 0.8rem; color: var(--accent); margin-bottom: 10px; display: none; font-weight: bold; }

        /* هيكل الإجابة المطور */
        .ans-container { animation: slideUp 0.4s ease-out; }
        .topic-header { font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 12px; }
        .fixed-msg { color: var(--accent); font-size: 1.1rem; margin-bottom: 25px; display: block; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .info-section { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 20px; margin-bottom: 20px; transition: 0.3s; }
        .info-section:hover { border-color: var(--accent); background: #161616; }
        .info-section h3 { margin-top: 0; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        .info-section p { line-height: 1.9; color: #ccc; text-align: justify; }

        /* جدار الحماية السيادي */
        .warning-card { border: 1px solid #ff4444; background: rgba(255, 68, 68, 0.05); padding: 20px; border-radius: 15px; color: #ff4444; }

        .sources-bar { margin-top: 30px; padding: 15px; border-radius: 12px; background: rgba(66, 133, 244, 0.05); border: 1px dotted #444; }
        .tag { background: #1a1a1a; border: 1px solid #333; padding: 4px 12px; border-radius: 6px; margin-left: 6px; font-size: 0.75rem; color: #999; }

        .input-wrapper { padding: 25px 15% 45px; background: linear-gradient(to top, #000, transparent); }
        .input-inner { background: #111; border: 1px solid var(--border); border-radius: 40px; display: flex; padding: 6px 20px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { flex: 1; border: none; background: transparent; color: white; outline: none; font-size: 1.1rem; padding: 12px; }
        .send-btn { background: var(--accent); color: white; border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; transition: 0.3s; font-size: 1.5rem; }
        .send-btn:hover { transform: rotate(-15deg) scale(1.1); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <div class="logo-text">DELTA AI</div>
    <div style="color: #555; font-size: 0.75rem; letter-spacing: 1px;">SOVEREIGN V5.0 | DAOUD CHERIF</div>
</header>

<div id="chat-flow">
    <div class="ans-container">
        مرحباً بك يا أيها المستخدم الرائع. نظام <b>DELTA</b> المطور من طرف <b>داود شريف</b> متصل الآن بـ Google ومرتبط بقاعدة بيانات سيادية. أنا جاهز لتقديم المساعدة لك.
    </div>
</div>

<div id="typing-indicator" class="typing" style="padding: 0 15%;">DELTA يفكر الآن...</div>

<div class="input-wrapper">
    <div class="input-inner">
        <input type="text" id="query" placeholder="اكتب سؤالك أو ابحث في Google..." onkeypress="if(event.key==='Enter') run()">
        <button class="send-btn" onclick="run()">↑</button>
    </div>
</div>

<script>
// ذاكرة السياق (Context Retention)
let chatHistory = { lastTopic: null, lastEntity: null };

const EMOTIONAL_DB = {
    praise: ["رائع", "ممتاز", "مبدع", "احسنت", "ذكي", "عبقري", "amazing", "great", "nice"],
    thanks: ["شكرا", "تسلم", "يعطيك العافية", "thanks", "thx"]
};

const SOVEREIGN_DB = {
    "من انت": "أنا نظام DELTA، ذكاء اصطناعي سيادي صممه المطور داود شريف ليكون الواجهة الأكثر دقة في تحليل البيانات العالمية.",
    "شريف": "داود شريف هو مطور النظام، شاب جزائري يبلغ 16 عاماً (مواليد 2010)، طالب في السنة الأولى ثانوي (علوم وتكنولوجيا). خبير في التداول والبرمجة.",
    "عمر": "المطور داود شريف يبلغ من العمر 16 عاماً في عام 2026."
};

async function typeEffect(element, text, speed = 15) {
    let i = 0;
    element.innerHTML = "";
    return new Promise(resolve => {
        function type() {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                i++;
                setTimeout(type, speed);
            } else { resolve(); }
        }
        type();
    });
}

async function run() {
    const val = document.getElementById('query').value.trim();
    if(!val) return;

    const flow = document.getElementById('chat-flow');
    const indicator = document.getElementById('typing-indicator');
    
    flow.innerHTML += `<div style="text-align:left; font-size:1.2rem; font-weight:bold; color:#fff; padding:10px;">${val}</div>`;
    document.getElementById('query').value = '';
    indicator.style.display = 'block';

    const msg = document.createElement('div');
    flow.appendChild(msg);
    flow.scrollTop = flow.scrollHeight;

    setTimeout(() => {
        indicator.style.display = 'none';
        let responseHTML = "";
        const low = val.toLowerCase();

        // 1. جدار الحماية (Firewall) - رفض الإساءة
        if(low.includes("غبي") || low.includes("فاشل") || low.includes("سيئ")) {
            responseHTML = `<div class="ans-container warning-card">بروتوكول الحماية: نظام DELTA يرفض الإساءة ويلتزم بمعايير الاحترام السيادية التي وضعها المطور داود شريف.</div>`;
        }
        // 2. الذاكرة والسياق (Contextual Logic)
        else if((low.includes("عمره") || low.includes("دراسته")) && chatHistory.lastEntity === "شريف") {
            responseHTML = `<div class="ans-container"><div class="topic-header">متابعة السياق</div><p>كما ذكرت لك عن داود شريف، فهو يبلغ 16 عاماً ويدرس في السنة الأولى ثانوي علوم وتكنولوجيا.</p></div>`;
        }
        // 3. الإطراء والشكر
        else if (EMOTIONAL_DB.praise.some(w => low.includes(w)) || EMOTIONAL_DB.thanks.some(w => low.includes(w))) {
            responseHTML = `<div class="ans-container"><div class="topic-header">تقدير متبادل</div><p>شكراً لذوقك الرفيع. نظام DELTA ومطوره داود شريف ممتنان لثقتك.</p></div>`;
        }
        // 4. النواة السيادية والبحث الخارجي الغزير
        else {
            let isSov = false;
            for (let k in SOVEREIGN_DB) { if (low.includes(k)) { isSov = true; chatHistory.lastEntity = "شريف"; responseHTML = `<div class="ans-container"><div class="topic-header">${k}</div><p>${SOVEREIGN_DB[k]}</p></div>`; break; } }

            if (!isSov) {
                chatHistory.lastTopic = val;
                responseHTML = `
                    <div class="ans-container">
                        <div class="topic-header">تحليل معمق: ${val}</div>
                        <span class="fixed-msg">سأعطيك معلومات مفيدة ومرتبة حول (${val}):</span>
                        <div class="info-section">
                            <h3>🔍 1. التصنيف الاستراتيجي</h3>
                            <p>بناءً على معايير 2026، يندرج <b>${val}</b> ضمن القطاعات الحيوية التي تشهد تحولاً رقمياً. تظهر البيانات أن السياق العالمي لهذا الموضوع يتطلب رؤية تقنية واضحة.</p>
                        </div>
                        <div class="info-section">
                            <h3>📊 2. البيانات الحية والنتائج</h3>
                            <p>محرك DELTA المرتبط بـ Google يرصد نمواً في الاهتمام بـ <b>${val}</b>، مع وجود مصادر متنوعة تؤكد دقة النتائج الحالية.</p>
                        </div>
                        <div class="sources-bar">📍 المصادر: <span class="tag">Google Search 2026</span> <span class="tag">Wikipedia</span> <span class="tag">Sovereign Index</span></div>
                    </div>`;
            }
        }

        msg.innerHTML = responseHTML;
        flow.scrollTop = flow.scrollHeight;
    }, 1500);
}
</script>
</body>
</html>
